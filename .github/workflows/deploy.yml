name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 10 * * 1" # Mondays, to pick up Metro Transit schedule changes
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download Metro Transit GTFS
        run: |
          curl -sSfL -o gtfs.zip https://svc.metrotransit.org/mtgtfs/gtfs.zip
          unzip -q gtfs.zip calendar.txt calendar_dates.txt routes.txt trips.txt shapes.txt stops.txt stop_times.txt -d gtfs
      - run: node scripts/build-gtfs.mjs gtfs
      - run: npx tsc --noEmit
      - name: Write freshness stamp
        run: |
          mkdir -p public/data
          echo "{\"updated\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"source\": \"Metro Transit GTFS\"}" > public/data/last_updated.json
      - run: npm run build
        env:
          REACT_APP_PEAK_KEY: ${{ secrets.REACT_APP_PEAK_KEY }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build
      - id: deployment
        uses: actions/deploy-pages@v5

  alert-on-failure:
    needs: deploy
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.create({
              ...context.repo,
              title: `Scheduled deploy failed (${new Date().toISOString().slice(0,10)})`,
              body: `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['stale-data'],
            });

  # Campus buses come from Peak Transit with REACT_APP_PEAK_KEY. If that key is revoked the map
  # still deploys but campus buses silently vanish, so check it each week and open an issue.
  peak-key:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Peak Transit key returns campus routes
        env:
          KEY: ${{ secrets.REACT_APP_PEAK_KEY }}
        run: |
          curl -sS --retry 3 --retry-delay 10 -o routes.json \
            "https://api.peaktransit.com/v5/index.php?app_id=_RIDER&key=$KEY&controller=route2&action=list&agencyID=88"
          python3 -c "import json; n = len(json.load(open('routes.json')).get('routes') or []); print(n, 'campus routes'); assert n > 0, 'no routes: key rejected or API changed'"
      - if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.create({
              ...context.repo,
              title: `Peak Transit key check failed (${new Date().toISOString().slice(0,10)})`,
              body: `Peak Transit returned no campus routes for REACT_APP_PEAK_KEY, so campus buses may be missing from the map. Check whether the key was revoked or the API changed.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['stale-data'],
            });

  # GitHub disables cron workflows after 60 days without repo activity.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # Re-enabling the workflow resets GitHub's 60-day inactivity timer.
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
